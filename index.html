<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MK Health">
<title>MK Health</title>
<style>
/* ── TOKENS ── */
:root {
  --bg:        #FAFBFF;
  --surface:   #FFFFFF;
  --border:    #E8ECF4;
  --border-s:  #D0D7E8;
  --text-1:    #0F1524;
  --text-2:    #4A5568;
  --text-3:    #8896B0;
  --text-4:    #B8C4D4;
  --brand:     #4F46E5;
  --brand-s:   #EEF2FF;
  --brand-b:   #C7D2FE;
  --ok:        #059669;
  --ok-s:      #ECFDF5;
  --ok-b:      #6EE7B7;
  --warn:      #D97706;
  --warn-s:    #FFFBEB;
  --warn-b:    #FCD34D;
  --crit:      #DC2626;
  --crit-s:    #FEF2F2;
  --crit-b:    #FCA5A5;
  --rad:       14px;
  --rad-s:     8px;
  --rad-l:     20px;
  --shadow:    0 1px 3px rgba(15,21,36,.07),0 1px 2px rgba(15,21,36,.04);
  --shadow-m:  0 4px 16px rgba(15,21,36,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);min-height:100vh;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',system-ui,sans-serif;color:var(--text-1);max-width:430px;margin:0 auto;-webkit-font-smoothing:antialiased;position:relative}
button{cursor:pointer;font-family:inherit;transition:opacity .13s,transform .1s}
button:active{transform:scale(.96)}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text-1);width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--rad-s);padding:11px 13px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
::-webkit-scrollbar{display:none}
textarea{resize:none}
a{color:var(--brand);text-decoration:none}
/* ── ANIMATIONS ── */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@keyframes slide-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.anim{animation:slide-up .22s ease forwards}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
'use strict';
const {useState,useEffect,useRef,useCallback,useMemo}=React;
const e=React.createElement;

/* ── CONFIG ─────────────────────────────────────────────────────────────── */
const LABS=[
  {key:'hba1c',        label:'HbA1c',           unit:'%',     cat:'Diabetes',     hi:6.5, cHi:8},
  {key:'glucose',      label:'Glucose',          unit:'mg/dl', cat:'Diabetes',     lo:70,  hi:99,  cHi:200},
  {key:'creatinine',   label:'Creatinine',       unit:'mg/dl', cat:'Kidneys',      hi:1.18,cHi:2},
  {key:'egfr',         label:'eGFR',             unit:'ml/min',cat:'Kidneys',      lo:60,  cLo:30},
  {key:'acr',          label:'ACR',              unit:'mg/g',  cat:'Kidneys',      hi:29,  cHi:300},
  {key:'bun',          label:'BUN',              unit:'mg/dl', cat:'Kidneys',      hi:26,  cHi:50},
  {key:'ldl',          label:'LDL',              unit:'mg/dl', cat:'Lipids',       hi:99,  cHi:160},
  {key:'hdl',          label:'HDL',              unit:'mg/dl', cat:'Lipids',       lo:40,  cLo:35},
  {key:'triglycerides',label:'Triglycerides',    unit:'mg/dl', cat:'Lipids',       hi:149, cHi:500},
  {key:'cholesterol',  label:'Cholesterol',      unit:'mg/dl', cat:'Lipids',       hi:199, cHi:300},
  {key:'hemoglobin',   label:'Hemoglobin',       unit:'g/dL',  cat:'Blood',        lo:13,  hi:16.7,cLo:10},
  {key:'wbc',          label:'WBC',              unit:'K/uL',  cat:'Blood',        lo:3.6, hi:11.2,cHi:15},
  {key:'platelets',    label:'Platelets',        unit:'K/uL',  cat:'Blood',        lo:140, hi:440, cLo:100},
  {key:'sodium',       label:'Sodium',           unit:'mEq/L', cat:'Electrolytes', lo:136, hi:145},
  {key:'potassium',    label:'Potassium',        unit:'mEq/L', cat:'Electrolytes', lo:3.5, hi:5.1, cHi:5.5},
  {key:'alt',          label:'ALT',              unit:'U/L',   cat:'Liver',        hi:44,  cHi:100},
  {key:'ast',          label:'AST',              unit:'U/L',   cat:'Liver',        hi:43,  cHi:100},
  {key:'albumin',      label:'Albumin',          unit:'g/dL',  cat:'Liver',        lo:3.5, hi:5.2},
  {key:'tsh',          label:'TSH',              unit:'mUI/L', cat:'Other',        lo:0.4, hi:4.0, cHi:10},
  {key:'vitamin_d',    label:'Vitamin D',        unit:'ng/mL', cat:'Other',        lo:30,  hi:100, cLo:10},
  {key:'vitamin_b12',  label:'Vitamin B12',      unit:'pg/mL', cat:'Other',        lo:200, hi:900},
  {key:'ferritin',     label:'Ferritin',         unit:'ng/mL', cat:'Other',        lo:12,  hi:300},
  {key:'uric_acid',    label:'Uric Acid',        unit:'mg/dl', cat:'Other',        hi:7.0, cHi:9},
  {key:'crp',          label:'CRP',              unit:'mg/L',  cat:'Other',        hi:5,   cHi:20},
  {key:'insulin',      label:'Insulin',          unit:'µIU/mL',cat:'Other',        hi:25},
  {key:'systolic',     label:'Systolic BP',      unit:'mmHg',  cat:'Vitals',       hi:130, cHi:160},
  {key:'diastolic',    label:'Diastolic BP',     unit:'mmHg',  cat:'Vitals',       hi:80,  cHi:100},
  {key:'weight_kg',    label:'Weight',           unit:'kg',    cat:'Vitals'},
  {key:'bmi',          label:'BMI',              unit:'kg/m²', cat:'Vitals',       hi:24.9,cHi:30},
  {key:'glucose_fasting',label:'Fasting Glucose',unit:'mg/dl', cat:'CGM',          hi:100, cHi:140},
  {key:'glucose_peak', label:'Peak Post-meal',   unit:'mg/dl', cat:'CGM',          hi:140, cHi:180},
  {key:'glucose_avg',  label:'Daily Average',    unit:'mg/dl', cat:'CGM',          hi:115, cHi:154},
  {key:'time_in_range',label:'Time in Range',    unit:'%',     cat:'CGM',          lo:70,  cLo:50},
  {key:'gmi',          label:'Glucose Mgmt Ind', unit:'%',     cat:'CGM',          hi:6.5, cHi:8},
];
const STELO_KEYS=['glucose_fasting','glucose_peak','glucose_avg','time_in_range','gmi'];
const CAT_ORDER=['Diabetes','Kidneys','Lipids','CGM','Vitals','Blood','Electrolytes','Liver','Other'];
const CAT_C={Diabetes:'#4F46E5',Kidneys:'#0891B2',Lipids:'#DC2626',CGM:'#7C3AED',Vitals:'#059669',Blood:'#DB2777',Electrolytes:'#D97706',Liver:'#16A34A',Other:'#6B7280'};

const MEDS_DEF={
  day:[
    {id:'m1', name:'Losartan',           dose:'25 mg',      with:'Breakfast',            note:'Kidney · blood pressure',    type:'rx'},
    {id:'m2', name:'Metformin',          dose:'500 mg',     with:'Breakfast',            note:'Diabetes — 1st dose',        type:'rx'},
    {id:'m3', name:'Fenofibrate',        dose:'145 mg',     with:'Lunch with fat',       note:'Triglycerides',              type:'rx'},
    {id:'m4', name:'Vitamin D3 + K2',   dose:'5000 IU',    with:'Breakfast',            note:'',                           type:'vit'},
    {id:'m5', name:'CoQ10',             dose:'200 mg',     with:'Breakfast + MCT oil',  note:'Essential with statin',      type:'vit'},
    {id:'m6', name:'Vitamin B12',        dose:'—',          with:'Breakfast',            note:'Metformin depletes B12',     type:'vit'},
    {id:'m7', name:'GTF Chromium',       dose:'200 mcg',    with:'Breakfast',            note:'',                           type:'vit'},
    {id:'m8', name:'Ceylon Cinnamon',    dose:'—',          with:'Breakfast',            note:'',                           type:'vit'},
    {id:'m9', name:'MCT Oil',            dose:'—',          with:'Coffee',               note:'',                           type:'vit'},
    {id:'m10',name:'Alpha Lipoic Acid',  dose:'—',          with:'30 min before eating', note:'Antioxidant · insulin',      type:'vit'},
    {id:'m11',name:'NMN',               dose:'—',          with:'30 min before eating', note:'NAD+ · longevity',           type:'vit'},
    {id:'m12',name:'Omega-3',           dose:'—',          with:'Lunch',                note:'Half dose',                  type:'vit'},
    {id:'m13',name:'Apple Cider Vinegar',dose:'—',         with:'Before lunch',         note:'',                           type:'vit'},
  ],
  night:[
    {id:'n1',name:'Atorvastatin',        dose:'40 mg',      with:'Before bed',           note:'Cholesterol — night only',   type:'rx'},
    {id:'n2',name:'Metformin',           dose:'500 mg',     with:'Dinner',               note:'Diabetes — 2nd dose',        type:'rx'},
    {id:'n3',name:'Magnesium Glycinate', dose:'300–400 mg', with:'Before bed',           note:'Sleep · blood pressure',     type:'vit'},
    {id:'n4',name:'Omega-3',            dose:'—',          with:'Dinner',               note:'2nd half of dose',           type:'vit'},
  ]
};
const CONTACTS_DEF=[
  {id:'c1',specialty:'Primary Care',    name:'',hospital:'',phone:'',notes:''},
  {id:'c2',specialty:'Nephrologist',    name:'',hospital:'',phone:'',notes:''},
  {id:'c3',specialty:'Cardiologist',    name:'',hospital:'',phone:'',notes:''},
  {id:'c4',specialty:'Endocrinologist', name:'',hospital:'',phone:'',notes:''},
];

/* ── UTILS ─────────────────────────────────────────────────────────────── */
function gst(f,v){
  if(v==null||v==='')return'ok';
  const n=parseFloat(v);if(isNaN(n))return'ok';
  if((f.cHi&&n>=f.cHi)||(f.cLo!=null&&n<=f.cLo))return'crit';
  if((f.hi&&n>f.hi)||(f.lo!=null&&n<f.lo))return'warn';
  return'ok';
}
const SC={crit:'var(--crit)',warn:'var(--warn)',ok:'var(--ok)'};
const SBG={crit:'var(--crit-s)',warn:'var(--warn-s)',ok:'var(--ok-s)'};
const SBD={crit:'var(--crit-b)',warn:'var(--warn-b)',ok:'var(--ok-b)'};
const gc=(f,v)=>SC[gst(f,v)];
const gbg=(f,v)=>SBG[gst(f,v)];
const nr=f=>{if(f.lo!=null&&f.hi)return f.lo+'–'+f.hi;if(f.hi)return'<'+f.hi;if(f.lo!=null)return'>'+f.lo;return'';};
const today=()=>new Date().toISOString().split('T')[0];
const lsG=(k,fb)=>{try{const d=localStorage.getItem(k);return d?JSON.parse(d):fb}catch{return fb}};
const lsS=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const toB64=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});
const fmtD=s=>{try{return new Date(s).toLocaleDateString('en',{month:'short',day:'numeric',year:'numeric'})}catch{return s||''}};

/* ── UI ATOMS ────────────────────────────────────────────────────────── */
const Card=({children,style,onClick})=>e('div',{onClick,style:{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'var(--rad)',padding:16,marginBottom:12,boxShadow:'var(--shadow)',...style}},children);
const Lbl=({t,style})=>e('label',{style:{fontSize:11,color:'var(--text-3)',display:'block',marginBottom:4,letterSpacing:.6,textTransform:'uppercase',fontWeight:500,...style}},t);
const Fld=({label,children})=>e('div',{style:{marginBottom:12}},e(Lbl,{t:label}),children);
const Sep=({color})=>e('div',{style:{height:'1px',background:(color||'var(--border)'),margin:'4px 0'}});

function StatusBadge({field,value}){
  const s=gst(field,value);if(s==='ok')return null;
  const n=nr(field);
  return e('span',{style:{display:'inline-flex',alignItems:'center',gap:3,fontSize:10,fontWeight:600,padding:'2px 8px',borderRadius:20,background:SBG[s],color:SC[s],border:'1px solid '+SBD[s]}},
    s==='crit'?'⚠ Critical':('↑ High'+(n?' · '+n+' '+field.unit:'')));
}

function ProgressBar({field,value}){
  if(!value)return null;
  const v=parseFloat(value),c=gc(field,v);
  const ref=field.cHi||(field.hi?field.hi*1.5:field.cLo?field.cLo*.5:100);
  const pct=Math.min(94,Math.max(4,(v/ref)*100));
  return e('div',{style:{height:4,background:'var(--bg)',borderRadius:2,overflow:'hidden',marginTop:5,border:'1px solid var(--border)'}},
    e('div',{style:{height:'100%',width:pct+'%',background:c,borderRadius:2,transition:'width .55s cubic-bezier(.4,0,.2,1)'}}));
}

function Sparkline({data,color}){
  if(!data||data.length<2)return null;
  const nums=data.map(Number).filter(v=>!isNaN(v));if(nums.length<2)return null;
  const mn=Math.min(...nums),mx=Math.max(...nums),rng=mx-mn||1;
  const W=68,H=28,p=4;
  const pts=nums.map((v,i)=>((i/(nums.length-1))*(W-p*2)+p)+','+(H-p-((v-mn)/rng)*(H-p*2))).join(' ');
  const lp=pts.trim().split(' ').at(-1).split(',');
  const trend=nums.at(-1)-nums[0];
  const tc=trend>rng*.07?'var(--crit)':trend<-rng*.07?'var(--ok)':'var(--text-3)';
  return e('div',{style:{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:2,flexShrink:0}},
    e('svg',{width:W,height:H,style:{display:'block'}},
      e('polyline',{points:pts,fill:'none',stroke:color,strokeWidth:'2',strokeLinejoin:'round',opacity:'.7'}),
      e('circle',{cx:parseFloat(lp[0]),cy:parseFloat(lp[1]),r:'3.5',fill:color})),
    e('span',{style:{fontSize:9,fontWeight:600,color:tc}},(trend>0?'↑':trend<0?'↓':'→')+' '+Math.abs(parseFloat(trend.toFixed(1)))));
}

function Toast({msg}){
  if(!msg)return null;
  return e('div',{style:{position:'fixed',top:76,left:'50%',transform:'translateX(-50%)',background:'var(--ok)',color:'#fff',borderRadius:'var(--rad-s)',padding:'9px 18px',fontSize:13,fontWeight:600,zIndex:900,boxShadow:'var(--shadow-m)',whiteSpace:'nowrap',pointerEvents:'none',animation:'slide-up .2s ease'}},msg);
}

function TopBar({title,subtitle,badge}){
  return e('div',{style:{padding:'16px 18px 12px',background:'var(--surface)',borderBottom:'1px solid var(--border)',position:'sticky',top:0,zIndex:60,boxShadow:'var(--shadow)'}},
    e('div',{style:{fontSize:9,color:'var(--brand)',letterSpacing:3,fontWeight:700,marginBottom:3,textTransform:'uppercase'}},'HEALTH MONITOR'),
    e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
      e('div',null,
        e('div',{style:{fontSize:20,fontWeight:700,color:'var(--text-1)',letterSpacing:'-.5px',lineHeight:1.1}},title),
        subtitle&&e('div',{style:{fontSize:12,color:'var(--text-3)',marginTop:3}},subtitle)),
      badge));
}

function BottomBar({tab,setTab}){
  const items=[
    {id:'home',   l:'Home',   ic:'⌂'},
    {id:'docs',   l:'Upload', ic:'↑'},
    {id:'meds',   l:'Meds',   ic:'⊕'},
    {id:'news',   l:'News',   ic:'◎'},
    {id:'history',l:'History',ic:'≡'},
    {id:'chat',   l:'Dr. AI', ic:'✦'},
  ];
  return e('div',{style:{position:'fixed',bottom:0,left:'50%',transform:'translateX(-50%)',width:'100%',maxWidth:430,background:'var(--surface)',borderTop:'1px solid var(--border)',display:'flex',zIndex:80,paddingBottom:'env(safe-area-inset-bottom)',boxShadow:'0 -2px 8px rgba(15,21,36,.06)'}},
    items.map(t=>e('button',{key:t.id,onClick:()=>setTab(t.id),style:{flex:1,padding:'9px 2px 10px',background:'none',border:'none',borderTop:'2px solid '+(tab===t.id?'var(--brand)':'transparent'),color:tab===t.id?'var(--brand)':'var(--text-4)',display:'flex',flexDirection:'column',alignItems:'center',gap:2,transition:'color .15s,border-color .15s'}},
      e('span',{style:{fontSize:18,lineHeight:1}},t.ic),
      e('span',{style:{fontSize:8,fontWeight:tab===t.id?700:500,letterSpacing:.6,textTransform:'uppercase'}},t.l))));
}

/* ── TREND CHART ──────────────────────────────────────────────────────── */
function TrendChart({entries}){
  const [sel,setSel]=useState(null);
  const available=useMemo(()=>LABS.filter(f=>entries.some(e=>e[f.key]!=null)),[entries]);
  useEffect(()=>{if(!sel&&available.length>0)setSel(available[0].key);},[available,sel]);
  if(!available.length)return null;
  const field=LABS.find(f=>f.key===sel)||available[0];
  const data=[...entries].filter(e=>e[field.key]!=null).map(e=>({date:e.date,val:parseFloat(e[field.key])})).sort((a,b)=>a.date.localeCompare(b.date));
  const color=CAT_C[field.cat]||'var(--brand)';
  const vals=data.map(d=>d.val);
  const mn=vals.length?Math.min(...vals):0,mx=vals.length?Math.max(...vals):100,rng=mx-mn||1;
  const W=300,H=110,WP=30,TP=14,BP=22;
  const pts=data.map((d,i)=>({x:WP+(i/Math.max(data.length-1,1))*(W-WP*2),y:TP+(1-(d.val-mn)/rng)*(H-TP-BP),d}));
  const first=data[0],last=data[data.length-1];
  const improved=last&&first?(field.lo&&!field.hi?last.val>first.val:last.val<first.val):false;
  return e(Card,null,
    e('div',{style:{fontSize:11,fontWeight:600,color:'var(--text-2)',marginBottom:10,letterSpacing:.3}},'Trend Analysis'),
    e('div',{style:{display:'flex',flexWrap:'wrap',gap:5,marginBottom:14}},
      available.slice(0,9).map(f=>e('button',{key:f.key,onClick:()=>setSel(f.key),style:{padding:'4px 10px',borderRadius:20,fontSize:10,fontWeight:500,border:'1px solid '+(sel===f.key?(CAT_C[f.cat]||'var(--brand)'):'var(--border)'),background:sel===f.key?(CAT_C[f.cat]||'var(--brand)'):'var(--surface)',color:sel===f.key?'#fff':'var(--text-2)',transition:'all .15s'}},f.label))),
    data.length<2
      ?e('div',{style:{textAlign:'center',padding:24,color:'var(--text-3)',fontSize:13}},'Upload 2+ results to see the trend for '+field.label)
      :e('svg',{width:'100%',viewBox:'0 0 '+W+' '+H,style:{display:'block',overflow:'visible'}},
        e('defs',null,e('linearGradient',{id:'grad',x1:'0',y1:'0',x2:'0',y2:'1'},
          e('stop',{offset:'0%',stopColor:color,stopOpacity:'.15'}),
          e('stop',{offset:'100%',stopColor:color,stopOpacity:'.01'}))),
        field.hi&&e('line',{x1:WP,x2:W-WP,y1:TP+(1-(field.hi-mn)/rng)*(H-TP-BP),y2:TP+(1-(field.hi-mn)/rng)*(H-TP-BP),stroke:'var(--border-s)',strokeWidth:'1',strokeDasharray:'4,3'}),
        pts.length>1&&e('polygon',{points:WP+','+(H-BP)+' '+pts.map(p=>p.x+','+p.y).join(' ')+' '+(W-WP)+','+(H-BP),fill:'url(#grad)'}),
        e('polyline',{points:pts.map(p=>p.x+','+p.y).join(' '),fill:'none',stroke:color,strokeWidth:'2.5',strokeLinejoin:'round',strokeLinecap:'round'}),
        pts.map((p,i)=>e('g',{key:i},
          e('circle',{cx:p.x,cy:p.y,r:'4.5',fill:'var(--surface)',stroke:color,strokeWidth:'2'}),
          e('text',{x:p.x,y:H-5,textAnchor:'middle',fontSize:'8',fill:'var(--text-3)',fontFamily:'inherit'},p.d.date.slice(5)))),
        e('text',{x:WP-3,y:TP+5,textAnchor:'end',fontSize:'8',fill:'var(--text-3)'},mx.toFixed(1)),
        e('text',{x:WP-3,y:H-BP+2,textAnchor:'end',fontSize:'8',fill:'var(--text-3)'},mn.toFixed(1))),
    data.length>=2&&e('div',{style:{display:'flex',gap:8,marginTop:12,paddingTop:12,borderTop:'1px solid var(--border)'}},
      [{l:'FIRST',v:first.val,bg:'var(--bg)',c:'var(--text-2)'},{l:'LATEST',v:last.val,bg:gbg(field,last.val),c:gc(field,last.val)}].map(x=>
        e('div',{key:x.l,style:{flex:1,background:x.bg,border:'1px solid var(--border)',borderRadius:'var(--rad-s)',padding:'8px 10px'}},
          e('div',{style:{fontSize:9,color:'var(--text-3)',marginBottom:3,letterSpacing:.6,fontWeight:500}},x.l),
          e('div',{style:{fontSize:16,fontWeight:700,color:x.c}},x.v,' ',e('span',{style:{fontSize:10,fontWeight:400,color:'var(--text-3)'}},field.unit)))),
      e('div',{style:{flex:1,background:improved?'var(--ok-s)':'var(--crit-s)',border:'1px solid '+(improved?'var(--ok-b)':'var(--crit-b)'),borderRadius:'var(--rad-s)',padding:'8px 10px'}},
        e('div',{style:{fontSize:9,color:'var(--text-3)',marginBottom:3,letterSpacing:.6,fontWeight:500}},'CHANGE'),
        e('div',{style:{fontSize:16,fontWeight:700,color:improved?'var(--ok)':'var(--crit)'}},
          (last.val-first.val>0?'+':'')+(last.val-first.val).toFixed(1),' ',e('span',{style:{fontSize:10,fontWeight:400,color:'var(--text-3)'}},field.unit)))));
}

/* ── HOME SCREEN ──────────────────────────────────────────────────────── */
function HomeScreen({entries,setTab}){
  const latest=entries[0]||{};
  const crits=LABS.filter(f=>latest[f.key]&&gst(f,latest[f.key])==='crit');
  const hist=key=>[...entries].filter(en=>en[key]!=null).map(en=>en[key]);

  if(!entries.length)return e('div',{style:{padding:'40px 24px',textAlign:'center'}},
    e('div',{style:{width:64,height:64,borderRadius:20,background:'var(--brand-s)',border:'1px solid var(--brand-b)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 16px',fontSize:28}},'🩺'),
    e('div',{style:{fontSize:18,fontWeight:700,color:'var(--text-1)',marginBottom:8}},'No data yet'),
    e('div',{style:{fontSize:14,color:'var(--text-3)',lineHeight:1.7,marginBottom:24}},'Upload your first lab results, PDF, photo, or document.',e('br'),'Albanian · English · Turkish · Spanish — all supported.'),

/* ── DOCS / UPLOAD SCREEN ─────────────────────────────────────────────── */
function DocsScreen({entries,setEntries,setTab,setToast}){
  const [phase,setPhase]=useState('idle');
  const [msg,setMsg]=useState('');
  const [preview,setPreview]=useState(null);
  const [processing,setProcessing]=useState('');
  const ref=useRef();

  const processFile=async file=>{
    const ext=file.name.split('.').pop().toLowerCase();
    const fname=file.name;
    setPhase('loading');setPreview(null);

    const steps=[
      'Reading file…',
      'Extracting text…',
      'Claude analyzing…',
      'Identifying values…',
      'Building report…',
    ];
    let si=0;
    const tick=setInterval(()=>{setProcessing(steps[si%steps.length]);si++;},1100);

    try{
      let body={filename:fname};

      if(['jpg','jpeg','png','webp','heic','heif'].includes(ext)){
        body.imageData=await toB64(file);
        body.imageMime=ext==='png'?'image/png':'image/jpeg';
      } else if(ext==='pdf'){
        body.imageData=await toB64(file);
        body.imageMime='application/pdf';
      } else if(['txt','csv'].includes(ext)){
        body.text=await file.text();
      } else if(['doc','docx','xls','xlsx'].includes(ext)){
        // For Word/Excel: convert to text via FileReader as binary string, send as text
        const text=await new Promise((res,rej)=>{
          const r=new FileReader();
          r.onload=()=>{
            // Extract readable text from binary
            const bin=r.result;
            let out='';
            for(let i=0;i<bin.length;i++){
              const c=bin.charCodeAt(i);
              if(c>31&&c<127)out+=bin[i];
              else if(c===10||c===13)out+='\n';
            }
            // Clean up — keep only printable runs of 3+ chars
            const cleaned=out.match(/[A-Za-z0-9\.,:;\-\/\(\)\s%]{3,}/g)||[];
            res(cleaned.join(' ').replace(/\s+/g,' '));
          };
          r.onerror=rej;
          r.readAsBinaryString(file);
        });
        if(!text.trim())throw new Error('Could not read content from this file. Try converting to PDF first.');
        body.text=text;
      } else {
        throw new Error('Unsupported format. Use JPG, PNG, PDF, TXT, CSV, DOCX, or XLSX.');
      }

      const r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const j=await r.json();
      if(!j.ok)throw new Error(j.error||'Analysis failed');

      clearInterval(tick);
      setPhase('done');
      setPreview({...j.data,filename:fname,uploadedAt:new Date().toISOString()});

    }catch(err){
      clearInterval(tick);
      setPhase('error');
      setMsg(err.message);
    }
  };

  const saveEntry=()=>{
    if(!preview)return;
    const entry={
      id:Date.now(),
      date:preview.date||today(),
      filename:preview.filename,
      document_type:preview.document_type||'lab_report',
      src:'upload',
      summary:preview.summary||'',
      alerts:preview.alerts||[],
      recommendations:preview.recommendations||[],
      raw_findings:preview.raw_findings||[],
      uploadedAt:preview.uploadedAt,
      ...preview.values
    };
    const updated=[entry,...entries];
    setEntries(updated);
    lsS('mk_entries_v3',updated);
    setToast('✓ Document saved to history');
    setPhase('idle');setPreview(null);
    setTimeout(()=>setTab('home'),400);
  };

  const bc=phase==='done'?'var(--ok)':phase==='error'?'var(--crit)':'var(--border-s)';

  return e('div',{style:{padding:'16px 16px 0'}},
    e('div',{style:{fontSize:13,color:'var(--text-3)',marginBottom:16,lineHeight:1.65}},'Upload any health document — photo, PDF, Word, Excel, or CSV. Claude reads Albanian, English, Turkish and Spanish automatically and extracts all values.'),

    e('div',{
      onClick:()=>{if(phase!=='loading'){setPhase('idle');setPreview(null);ref.current&&ref.current.click();}},
      onDrop:e=>{e.preventDefault();!e.dataTransfer.files[0]||processFile(e.dataTransfer.files[0]);},
      onDragOver:ev=>ev.preventDefault(),
      style:{border:'2px dashed '+bc,borderRadius:'var(--rad-l)',padding:'36px 20px',textAlign:'center',cursor:phase==='loading'?'default':'pointer',background:'var(--surface)',marginBottom:16,transition:'border-color .25s'}},
      e('div',{style:{marginBottom:12}},
        phase==='loading'
          ?e('div',{style:{width:44,height:44,border:'3px solid var(--border)',borderTopColor:'var(--brand)',borderRadius:'50%',margin:'0 auto',animation:'spin 1s linear infinite'}})
          :e('div',{style:{fontSize:36,lineHeight:1}},phase==='done'?'✓':phase==='error'?'✕':'↑')),
      e('div',{style:{fontSize:15,fontWeight:600,marginBottom:4,color:phase==='error'?'var(--crit)':phase==='done'?'var(--ok)':'var(--text-1)'}},
        {idle:'Upload your document',loading:processing,done:'Document analyzed — review below',error:'Analysis failed'}[phase]||msg),
      e('div',{style:{fontSize:12,color:'var(--text-3)',lineHeight:1.6}},
        phase==='error'?msg:(phase==='idle'||phase==='done')?'JPG · PNG · PDF · DOCX · XLSX · CSV · TXT':''),
      phase==='loading'&&e('div',{style:{display:'flex',justifyContent:'center',gap:6,marginTop:14}},
        [0,1,2].map(i=>e('div',{key:i,style:{width:7,height:7,borderRadius:'50%',background:'var(--brand)',animation:'pulse 1.1s ease-in-out '+(i*.18)+'s infinite'}}))),
      (phase==='error'||phase==='done')&&e('div',{style:{marginTop:10,fontSize:12,color:'var(--text-3)',cursor:'pointer',textDecoration:'underline'}},'Tap to upload another')),

    e('input',{ref,type:'file',style:{display:'none'},accept:'.jpg,.jpeg,.png,.pdf,.txt,.csv,.heic,.heif,.webp,.doc,.docx,.xls,.xlsx',onChange:ev=>ev.target.files&&ev.target.files[0]&&processFile(ev.target.files[0])}),

    /* Preview */
    preview&&e('div',{className:'anim'},
      e(Card,{style:{border:'1px solid var(--ok-b)',background:'var(--ok-s)'}},
        e('div',{style:{fontSize:11,fontWeight:700,color:'var(--ok)',letterSpacing:1.5,marginBottom:12}},'CLAUDE EXTRACTED FROM: '+preview.filename),
        preview.date&&e('div',{style:{fontSize:12,color:'var(--text-3)',marginBottom:10,display:'flex',alignItems:'center',gap:6}},
          e('span',null,'📅'),e('strong',null,preview.date)),

        /* Values grid */
        e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:7,marginBottom:12}},
          LABS.map(f=>{
            const v=preview.values&&preview.values[f.key];
            if(v==null)return null;
            const c=gc(f,v),bg=gbg(f,v);
            return e('div',{key:f.key,style:{background:'var(--surface)',borderRadius:'var(--rad-s)',padding:'8px 11px',borderLeft:'3px solid '+c}},
              e('div',{style:{fontSize:9,color:'var(--text-3)',marginBottom:2,textTransform:'uppercase',letterSpacing:.5}},f.label),
              e('div',{style:{fontSize:15,fontWeight:700,color:c}},v,' ',e('span',{style:{fontSize:9,opacity:.5,fontWeight:400}},f.unit)));
          })),

        /* Summary */
        preview.summary&&e('div',{style:{fontSize:13,color:'var(--text-2)',lineHeight:1.65,marginBottom:12,padding:'10px 12px',background:'var(--surface)',borderRadius:'var(--rad-s)',border:'1px solid var(--border)'}},preview.summary),

        /* Alerts */
        preview.alerts&&preview.alerts.length>0&&e('div',{style:{marginBottom:10}},
          preview.alerts.map((a,i)=>e('div',{key:i,style:{fontSize:12,color:'var(--crit)',padding:'4px 0',display:'flex',gap:6,alignItems:'flex-start'}},
            e('span',null,'⚠'),e('span',null,a)))),

        /* Recommendations */
        preview.recommendations&&preview.recommendations.length>0&&e('div',{style:{marginBottom:12}},
          e('div',{style:{fontSize:11,fontWeight:700,color:'var(--brand)',letterSpacing:1,marginBottom:6}},'RECOMMENDATIONS'),
          preview.recommendations.map((r,i)=>e('div',{key:i,style:{fontSize:12,color:'var(--text-2)',padding:'4px 0',display:'flex',gap:8,alignItems:'flex-start',borderBottom:'1px solid var(--border)'}},
            e('span',{style:{color:'var(--brand)',fontWeight:700,flexShrink:0}},i+1+'.'),e('span',null,r)))),

        e('button',{onClick:saveEntry,style:{width:'100%',background:'var(--ok)',border:'none',borderRadius:'var(--rad-s)',padding:'13px',color:'#fff',fontSize:14,fontWeight:700,cursor:'pointer'}},'✓ Save to My Health Records'))));
}

    e('div',{style:{display:'flex',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'var(--rad)',padding:3,gap:2,marginBottom:16}},
      [['all','All'],['diabetes','🩸 Diabetes'],['longevity','⚡ Longevity'],['health','💊 General']].map(([v,l])=>
        e('button',{key:v,onClick:()=>setFilter(v),style:{flex:1,padding:'8px 4px',border:'none',borderRadius:10,background:filter===v?'var(--brand)':'transparent',color:filter===v?'#fff':'var(--text-3)',fontSize:11,fontWeight:filter===v?600:500,cursor:'pointer',transition:'all .15s'}},l))),

    loading&&e('div',{style:{textAlign:'center',padding:'48px 20px'}},
      e('div',{style:{width:32,height:32,border:'3px solid var(--border)',borderTopColor:'var(--brand)',borderRadius:'50%',margin:'0 auto 12px',animation:'spin 1s linear infinite'}}),
      e('div',{style:{fontSize:13,color:'var(--text-3)'}},'Loading health news…')),

    err&&e('div',{style:{textAlign:'center',padding:'32px 20px'}},
      e('div',{style:{fontSize:13,color:'var(--crit)',marginBottom:10}},err),
      e('button',{onClick:()=>load(true),style:{background:'var(--brand)',border:'none',borderRadius:'var(--rad-s)',padding:'8px 18px',color:'#fff',fontSize:13,fontWeight:500,cursor:'pointer'}},'Try again')),

    !loading&&!err&&filtered.map((a,i)=>{
      const isDiab=a.cat==='diabetes',isLong=a.cat==='longevity';
      const tc=isDiab?'var(--brand)':isLong?'var(--ok)':'var(--warn)';
      const tbg=isDiab?'var(--brand-s)':isLong?'var(--ok-s)':'var(--warn-s)';
      const tbd=isDiab?'var(--brand-b)':isLong?'var(--ok-b)':'var(--warn-b)';
      return e('a',{key:i,href:a.link,target:'_blank',rel:'noopener noreferrer',style:{display:'block',textDecoration:'none',animation:'slide-up .2s ease',animationFillMode:'both',animationDelay:(i*.04)+'s'}},
        e(Card,{style:{marginBottom:10,cursor:'pointer'}},
          e('div',{style:{display:'flex',alignItems:'center',gap:8,marginBottom:8}},
            e('span',{style:{fontSize:10,fontWeight:600,padding:'2px 9px',borderRadius:20,background:tbg,color:tc,border:'1px solid '+tbd}},a.cat==='diabetes'?'Diabetes':a.cat==='longevity'?'Longevity':'Health'),
            e('span',{style:{fontSize:11,color:'var(--text-4)',flexShrink:0}},a.src)),
          e('div',{style:{fontSize:14,fontWeight:600,color:'var(--text-1)',lineHeight:1.4,marginBottom:6}},a.title),
          a.desc&&e('div',{style:{fontSize:12,color:'var(--text-3)',lineHeight:1.55,marginBottom:8}},a.desc.length>180?a.desc.slice(0,180)+'…':a.desc),
          e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
            e('span',{style:{fontSize:10,color:'var(--text-4)'}},a.date?fmtD(a.date):''),
            e('span',{style:{fontSize:11,color:'var(--brand)',fontWeight:600}},'Read more →'))));
    }));
}

/* ── HISTORY SCREEN ───────────────────────────────────────────────────── */
function HistoryScreen({entries,setEntries}){
  const [exp,setExp]=useState(null);
  const byMonth={};
  entries.forEach(en=>{const m=en.date?en.date.slice(0,7):'Unknown';if(!byMonth[m])byMonth[m]=[];byMonth[m].push(en);});
  const mname=m=>{if(m==='Unknown')return'Unknown date';const[y,mo]=m.split('-');return new Date(parseInt(y),parseInt(mo)-1).toLocaleString('en',{month:'long',year:'numeric'});};
  const del=id=>{const u=entries.filter(e=>e.id!==id);setEntries(u);lsS('mk_entries_v3',u);};

  if(!entries.length)return e('div',{style:{padding:'16px 16px 0',textAlign:'center',paddingTop:60}},
    e('div',{style:{fontSize:36,marginBottom:10,opacity:.15}},'📋'),
    e('div',{style:{fontSize:14,color:'var(--text-3)'}},'No history yet. Upload your first document.'));

  return e('div',{style:{padding:'16px 16px 0'}},
    e('div',{style:{fontSize:12,color:'var(--text-3)',marginBottom:16}},entries.length+' documents · organized by month'),
    Object.keys(byMonth).sort((a,b)=>b.localeCompare(a)).map(month=>e('div',{key:month,style:{marginBottom:20}},
      e('div',{style:{fontSize:10,fontWeight:700,color:'var(--text-3)',letterSpacing:1.5,textTransform:'uppercase',marginBottom:10}},mname(month)),
      byMonth[month].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(en=>{
        const isOpen=exp===en.id;
        const fields=LABS.filter(f=>en[f.key]!=null);
        const critCt=fields.filter(f=>gst(f,en[f.key])==='crit').length;
        return e(Card,{key:en.id,onClick:()=>setExp(isOpen?null:en.id),style:{cursor:'pointer',borderColor:isOpen?'var(--brand-b)':'var(--border)',boxShadow:isOpen?'0 0 0 2px var(--brand-b)':'var(--shadow)',transition:'all .2s'}},
          e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},
            e('div',null,
              e('div',{style:{display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}},
                e('span',{style:{fontSize:14,fontWeight:600,color:'var(--text-1)'}},en.date),
                critCt>0?e('span',{style:{fontSize:9,fontWeight:700,padding:'2px 7px',borderRadius:20,background:'var(--crit-s)',color:'var(--crit)',border:'1px solid var(--crit-b)'}},critCt+' critical'):e('span',{style:{fontSize:9,fontWeight:600,padding:'2px 7px',borderRadius:20,background:'var(--brand-s)',color:'var(--brand)',border:'1px solid var(--brand-b)'}},en.document_type==='cgm_export'?'CGM':'Lab')),
              e('div',{style:{fontSize:10,color:'var(--text-4)',marginTop:3}},en.filename||'Uploaded document')),
            e('div',{style:{display:'flex',gap:10,alignItems:'center'}},
              e('span',{style:{fontSize:12,color:'var(--text-4)'}},isOpen?'▲':'▼'),
              e('button',{onClick:ev=>{ev.stopPropagation();del(en.id);},style:{background:'none',border:'none',color:'var(--border-s)',fontSize:16,padding:0,lineHeight:1,transition:'color .15s'},onMouseEnter:ev=>ev.target.style.color='var(--crit)',onMouseLeave:ev=>ev.target.style.color='var(--border-s)'},'✕'))),
          isOpen&&e('div',{style:{marginTop:14,paddingTop:12,borderTop:'1px solid var(--border)'}},
            en.summary&&e('div',{style:{fontSize:13,color:'var(--text-2)',lineHeight:1.65,marginBottom:12,padding:'10px 12px',background:'var(--bg)',borderRadius:'var(--rad-s)',border:'1px solid var(--border)'}},en.summary),
            CAT_ORDER.map(cat=>{
              const fs=LABS.filter(f=>f.cat===cat&&en[f.key]!=null);if(!fs.length)return null;
              const cc=CAT_C[cat];
              return e('div',{key:cat,style:{marginBottom:12}},
                e('div',{style:{fontSize:9,fontWeight:700,color:cc,letterSpacing:1,textTransform:'uppercase',marginBottom:7}},cat),
                e('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:6}},
                  fs.map(f=>{const s=gst(f,en[f.key]);return e('div',{key:f.key,style:{background:SBG[s],border:'1px solid '+SBD[s],borderRadius:'var(--rad-s)',padding:'7px 11px',borderLeft:'3px solid '+SC[s]}},
                    e('div',{style:{fontSize:9,color:'var(--text-3)',marginBottom:2,textTransform:'uppercase',letterSpacing:.5}},f.label),
                    e('div',{style:{fontSize:14,fontWeight:700,color:SC[s]}},en[f.key],' ',e('span',{style:{fontSize:8,opacity:.5,fontWeight:400}},f.unit)));}))),
            }),
            en.recommendations&&en.recommendations.length>0&&e('div',{style:{marginTop:10}},
              e('div',{style:{fontSize:10,fontWeight:700,color:'var(--brand)',letterSpacing:1,marginBottom:6}},'RECOMMENDATIONS'),
              en.recommendations.map((r,i)=>e('div',{key:i,style:{fontSize:12,color:'var(--text-2)',padding:'5px 0',borderBottom:'1px solid var(--border)',display:'flex',gap:8}},
                e('span',{style:{color:'var(--brand)',fontWeight:700,flexShrink:0}},i+1+'.'),e('span',null,r))))));
      }))));
}

/* ── CHAT SCREEN (Dr. AI) ─────────────────────────────────────────────── */
function ChatScreen({entries}){
  const [msgs,setMsgs]=useState([{role:'assistant',content:'Hello Mikail. I\'m Dr. AI — your personal health advisor with access to all your uploaded lab results and documents.\n\nI can analyze your results, explain what values mean, compare progress over time, and give specific recommendations based on your actual data. I know your full history with diabetes, kidney disease, and lipid management.\n\nWhat would you like to discuss today?'}]);
  const [input,setInput]=useState('');
  const [loading,setLoading]=useState(false);
  const bottomRef=useRef();
  useEffect(()=>{bottomRef.current&&bottomRef.current.scrollIntoView({behavior:'smooth'});},[msgs]);

  const buildCtx=()=>{
    if(!entries.length)return'No lab data uploaded yet.';
    let ctx='UPLOADED DOCUMENTS ('+entries.length+' total):\n\n';
    entries.slice(0,8).forEach((en,i)=>{
      ctx+='[Document '+(i+1)+']\n';
      ctx+='Date: '+(en.date||'unknown')+'\n';
      ctx+='File: '+(en.filename||'unknown')+'\n';
      if(en.summary)ctx+='Summary: '+en.summary+'\n';
      const vals=LABS.filter(f=>en[f.key]!=null).map(f=>f.label+': '+en[f.key]+' '+f.unit);
      if(vals.length)ctx+='Values: '+vals.join(', ')+'\n';
      if(en.alerts&&en.alerts.length)ctx+='Alerts: '+en.alerts.join('; ')+'\n';
      ctx+='\n';
    });
    return ctx;
  };

  const SUGG=[
    'Analyze my latest results — what\'s most important?',
    'Explain my ACR of 2,265 and kidney situation',
    'Compare all my results over time',
    'Is my LDL under control with Atorvastatin 40mg?',
    'What should I ask my nephrologist?',
    'How is my diabetes progressing from Aug 2025 to now?',
    'What does my Stelo data show about glucose patterns?',
    'Am I on the right medications for my conditions?',
  ];

  const send=async text=>{
    const msg=(text||input).trim();if(!msg||loading)return;
    setInput('');
    const updated=[...msgs,{role:'user',content:msg}];
    setMsgs(updated);setLoading(true);
    try{
      const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:updated,context:buildCtx(),documents:buildCtx()})});
      const j=await r.json();
      setMsgs(p=>[...p,{role:'assistant',content:j.ok?j.message:'Sorry, there was an error: '+j.error}]);
    }catch{setMsgs(p=>[...p,{role:'assistant',content:'Connection error. Please check your internet and try again.'}]);}
    setLoading(false);
  };

  return e('div',{style:{display:'flex',flexDirection:'column',height:'calc(100dvh - 154px)',background:'var(--bg)'}},
    /* Messages */
    e('div',{style:{flex:1,overflowY:'auto',padding:'16px 16px 8px'}},
      msgs.map((m,i)=>e('div',{key:i,style:{marginBottom:14,display:'flex',flexDirection:'column',alignItems:m.role==='user'?'flex-end':'flex-start',animation:'fade .2s ease'}},
        m.role==='assistant'&&e('div',{style:{display:'flex',alignItems:'center',gap:6,marginBottom:5}},
          e('div',{style:{width:24,height:24,borderRadius:8,background:'var(--brand)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,flexShrink:0}},'✦'),
          e('span',{style:{fontSize:10,color:'var(--brand)',fontWeight:700,letterSpacing:.8}},'DR. AI — HEALTH ADVISOR')),
        e('div',{style:{maxWidth:'88%',padding:'11px 14px',borderRadius:m.role==='user'?'16px 16px 3px 16px':'3px 16px 16px 16px',background:m.role==='user'?'var(--brand)':'var(--surface)',color:m.role==='user'?'#fff':'var(--text-1)',fontSize:13,lineHeight:1.65,border:m.role==='assistant'?'1px solid var(--border)':'none',boxShadow:m.role==='assistant'?'var(--shadow)':'none',whiteSpace:'pre-wrap'}},m.content))),
      loading&&e('div',{style:{marginBottom:14,display:'flex',flexDirection:'column',alignItems:'flex-start'}},
        e('div',{style:{display:'flex',alignItems:'center',gap:6,marginBottom:5}},
          e('div',{style:{width:24,height:24,borderRadius:8,background:'var(--brand)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12}},'✦'),
          e('span',{style:{fontSize:10,color:'var(--brand)',fontWeight:700,letterSpacing:.8}},'DR. AI')),
        e('div',{style:{padding:'12px 16px',borderRadius:'3px 16px 16px 16px',background:'var(--surface)',border:'1px solid var(--border)',boxShadow:'var(--shadow)',display:'inline-flex',gap:6,alignItems:'center'}},
          [0,1,2].map(i=>e('div',{key:i,style:{width:7,height:7,borderRadius:'50%',background:'var(--brand)',animation:'pulse 1.1s ease-in-out '+(i*.18)+'s infinite'}})))),
      msgs.length===1&&e('div',{style:{marginTop:12}},
        e('div',{style:{fontSize:11,color:'var(--text-3)',marginBottom:8,fontWeight:500}},'Suggested questions:'),
        SUGG.map((s,i)=>e('button',{key:i,onClick:()=>send(s),style:{display:'block',width:'100%',textAlign:'left',background:'var(--surface)',border:'1px solid var(--border)',borderRadius:'var(--rad)',padding:'10px 13px',marginBottom:6,fontSize:12,color:'var(--text-2)',cursor:'pointer',boxShadow:'var(--shadow)',transition:'border-color .15s',lineHeight:1.5}},s))),
      e('div',{ref:bottomRef})),
    /* Input */
    e('div',{style:{padding:'8px 14px 14px',background:'var(--surface)',borderTop:'1px solid var(--border)',boxShadow:'0 -2px 8px rgba(15,21,36,.05)'}},
      e('div',{style:{display:'flex',gap:8,alignItems:'flex-end'}},
        e('textarea',{value:input,onChange:ev=>setInput(ev.target.value),onKeyDown:ev=>{if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();send();}},placeholder:'Ask Dr. AI about your results…',style:{flex:1,background:'var(--bg)',border:'1px solid var(--border)',borderRadius:'var(--rad)',padding:'10px 13px',fontSize:13,height:44,outline:'none',lineHeight:1.45,transition:'border-color .15s,box-shadow .15s'}}),
        e('button',{onClick:()=>send(),disabled:!input.trim()||loading,style:{width:44,height:44,borderRadius:'var(--rad)',flexShrink:0,background:(input.trim()&&!loading)?'var(--brand)':'var(--border)',border:'none',color:'#fff',fontSize:18,display:'flex',alignItems:'center',justifyContent:'center',transition:'background .2s',cursor:(input.trim()&&!loading)?'pointer':'not-allowed'}},'↑'))));
}

/* ── APP ROOT ─────────────────────────────────────────────────────────── */
function App(){
  const [tab,setTab]=useState('home');
  const [entries,setEntries]=useState([]);
  const [toast,setToast]=useState('');

  useEffect(()=>{setEntries(lsG('mk_entries_v3',[]));},[]);

  const flash=msg=>{setToast(msg);setTimeout(()=>setToast(''),1800);};

  const L=entries[0]||{};
  const crits=LABS.filter(f=>L[f.key]&&gst(f,L[f.key])==='crit');
  const badge=crits.length>0
    ?e('div',{style:{background:'var(--crit-s)',border:'1px solid var(--crit-b)',borderRadius:'var(--rad-s)',padding:'4px 10px',fontSize:11,color:'var(--crit)',fontWeight:700}},'⚠ '+crits.length)
    :null;

  const headers={
    home:   {title:'Mikail Kocak',   subtitle:'46 yrs · Los Angeles, CA', badge},
    docs:   {title:'Upload',         subtitle:'All formats · all languages'},
    meds:   {title:'Medications',    subtitle:'Day & night · tap to check off'},
    news:   {title:'Health News',    subtitle:'Diabetes · Longevity · updated every 3h'},
    history:{title:'History',        subtitle:entries.length+' documents'},
    chat:   {title:'Dr. AI',         subtitle:'Your personal health advisor'},
  };
  const hp=headers[tab]||headers.home;

  return e('div',{style:{minHeight:'100dvh',paddingBottom:80,background:'var(--bg)'}},
    e(TopBar,{title:hp.title,subtitle:hp.subtitle,badge:hp.badge}),
    e(Toast,{msg:toast}),
    tab==='home'   &&e(HomeScreen,   {entries,setTab}),
    tab==='docs'   &&e(DocsScreen,   {entries,setEntries,setTab,setToast:flash}),
    tab==='meds'   &&e(MedsScreen,   null),
    tab==='news'   &&e(NewsScreen,   null),
    tab==='history'&&e(HistoryScreen,{entries,setEntries}),
    tab==='chat'   &&e(ChatScreen,   {entries}),
    e(BottomBar,{tab,setTab}));
}

ReactDOM.createRoot(document.getElementById('root')).render(e(App));
</script>
</body>
</html>
